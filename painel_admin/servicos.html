<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordens de Serviço</title><link rel="stylesheet" href="css/admin.css"></head><body><script>if(localStorage.sosAuth!=='1')location.href='login.html'</script><header><h1>Ordens de Serviço</h1><a href="painel.html">Voltar</a></header><main><form id="form"><input id="cliente" placeholder="Cliente" required><input id="aparelho" placeholder="Aparelho" required><input id="defeito" placeholder="Defeito" required><input id="valor" type="number" step=".01" placeholder="Valor"><select id="status"><option>Recebido</option><option>Em análise</option><option>Aguardando peça</option><option>Pronto</option><option>Entregue</option></select><button>Criar OS</button></form><div id="lista"></div></main><script>let arr=JSON.parse(localStorage.sosOrders||'[]');function render(){lista.innerHTML=arr.map((x,i)=>`<div class="item"><b>OS #${i+1}</b> — ${x.cliente} — ${x.aparelho} — ${x.status} — R$ ${Number(x.valor||0).toFixed(2)} <button onclick="del(${i})">Excluir</button></div>`).join('')}form.onsubmit=e=>{e.preventDefault();arr.push({cliente:cliente.value,aparelho:aparelho.value,defeito:defeito.value,valor:valor.value,status:status.value});localStorage.sosOrders=JSON.stringify(arr);form.reset();render()};function del(i){arr.splice(i,1);localStorage.sosOrders=JSON.stringify(arr);render()}render()</script></body></html>
