<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos</title><link rel="stylesheet" href="css/admin.css"></head><body><script>if(localStorage.sosAuth!=='1')location.href='login.html'</script><header><h1>Produtos e Estoque</h1><a href="painel.html">Voltar</a></header><main><form id="form"><input id="nome" placeholder="Produto" required><input id="preco" type="number" step=".01" placeholder="Preço" required><input id="qtd" type="number" placeholder="Quantidade" required><button>Cadastrar</button></form><div id="lista"></div></main><script>let arr=JSON.parse(localStorage.sosProducts||'[]');function render(){lista.innerHTML=arr.map((x,i)=>`<div class="item"><b>${x.nome}</b> — R$ ${Number(x.preco).toFixed(2)} — estoque: ${x.qtd} <button onclick="del(${i})">Excluir</button></div>`).join('')}form.onsubmit=e=>{e.preventDefault();arr.push({nome:nome.value,preco:preco.value,qtd:qtd.value});localStorage.sosProducts=JSON.stringify(arr);form.reset();render()};function del(i){arr.splice(i,1);localStorage.sosProducts=JSON.stringify(arr);render()}render()</script></body></html>
