<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - S.O.S</title><link rel="stylesheet" href="css/admin.css"></head><body class="login"><form id="login"><h1>S.O.S Manutenção</h1><p>Painel Administrativo</p><input id="user" placeholder="Usuário" required><input id="pass" type="password" placeholder="Senha" required><button>Entrar</button><p id="erro"></p></form><script>login.onsubmit=e=>{e.preventDefault();if(user.value==='admin'&&pass.value==='admin123'){localStorage.sosAuth='1';location.href='painel.html'}else erro.textContent='Usuário ou senha inválidos.'}</script></body></html>
