<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes</title><link rel="stylesheet" href="css/admin.css"></head><body><script>if(localStorage.sosAuth!=='1')location.href='login.html'</script><header><h1>Clientes</h1><a href="painel.html">Voltar</a></header><main><form id="form"><input id="nome" placeholder="Nome" required><input id="tel" placeholder="WhatsApp"><button>Cadastrar</button></form><div id="lista"></div></main><script>let arr=JSON.parse(localStorage.sosClients||'[]');function render(){lista.innerHTML=arr.map((x,i)=>`<div class="item"><b>${x.nome}</b> — ${x.tel||''} <button onclick="del(${i})">Excluir</button></div>`).join('')}form.onsubmit=e=>{e.preventDefault();arr.push({nome:nome.value,tel:tel.value});localStorage.sosClients=JSON.stringify(arr);form.reset();render()};function del(i){arr.splice(i,1);localStorage.sosClients=JSON.stringify(arr);render()}render()</script></body></html>
